<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complaint Details - CampusFix</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <header id="app-header"></header>

    <main class="page-container">
        <p><a id="back-link" href="#">&larr; Back to dashboard</a></p>
        <div id="page-message" class="hidden"></div>

        <div class="two-column-layout">
            <div>
                <!-- Main complaint information -->
                <section class="card" id="complaint-summary">
                    <p class="muted">Loading complaint...</p>
                </section>

                <!-- Conversation -->
                <section class="card">
                    <h2>Messages &amp; notes</h2>
                    <div id="comment-list"></div>
                </section>
            </div>

            <div>
                <!-- Buttons and forms depend on the user's role and the complaint status -->
                <section class="card" id="action-panel">
                    <h2>Actions</h2>
                    <div id="action-message" class="hidden"></div>
                    <div id="action-content"></div>
                </section>

                <section class="card">
                    <h2>Status timeline</h2>
                    <ul class="timeline" id="history-timeline"></ul>
                </section>
            </div>
        </div>
    </main>

    <script src="../js/auth.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/ui.js"></script>
    <script src="../js/complaint-details.js"></script>
</body>
</html>
