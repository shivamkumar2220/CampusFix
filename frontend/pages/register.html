<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - CampusFix</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <main class="auth-page">
        <div class="auth-card">
            <div class="brand">
                <span class="brand-logo">CF</span>
                <span class="brand-name">Campus<span>Fix</span></span>
            </div>
            <p class="auth-subtitle">Create your student account</p>

            <div id="register-message" class="hidden"></div>

            <form id="register-form" novalidate>
                <div class="form-group">
                    <label for="full-name">Full name</label>
                    <input type="text" id="full-name" required minlength="2" maxlength="100" autocomplete="name">
                </div>
                <div class="form-group">
                    <label for="email">College email</label>
                    <input type="email" id="email" required autocomplete="email">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" required minlength="8" autocomplete="new-password">
                    <p class="form-hint">At least 8 characters.</p>
                </div>
                <div class="form-group">
                    <label for="confirm-password">Confirm password</label>
                    <input type="password" id="confirm-password" required autocomplete="new-password">
                </div>
                <button type="submit" class="button button-primary button-full" id="register-button">Create account</button>
            </form>

            <p class="auth-footer">Already registered? <a href="login.html">Log in</a></p>
        </div>
    </main>

    <script src="../js/auth.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/ui.js"></script>
    <script src="../js/register.js"></script>
</body>
</html>
