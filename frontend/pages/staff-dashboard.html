<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Dashboard - CampusFix</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <header id="app-header"></header>

    <main class="page-container">
        <div class="page-title-row">
            <div>
                <h1 id="staff-heading">Assigned Complaints</h1>
                <p class="muted">Most urgent first. Open a complaint to add notes, ask for info or change priority.</p>
            </div>
            <button class="button button-secondary" id="refresh-button">Refresh</button>
        </div>

        <section class="stats-grid" id="staff-stats"></section>

        <section class="card">
            <div class="toolbar">
                <div class="form-group">
                    <label for="status-filter">Status</label>
                    <select id="status-filter"></select>
                </div>
                <div class="form-group">
                    <label for="priority-filter">Priority</label>
                    <select id="priority-filter"></select>
                </div>
                <div class="form-group">
                    <label for="category-filter">Category</label>
                    <select id="category-filter"></select>
                </div>
                <div class="form-group">
                    <label for="search-box">Search</label>
                    <input type="search" id="search-box" placeholder="Title or location">
                </div>
            </div>
            <div id="staff-message" class="hidden"></div>
            <div id="assigned-complaints-table"></div>
        </section>
    </main>

    <script src="../js/auth.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/ui.js"></script>
    <script src="../js/staff-dashboard.js"></script>
</body>
</html>
