<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - CampusFix</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <header id="app-header"></header>

    <main class="page-container">
        <div class="page-title-row">
            <div>
                <h1>Admin Dashboard</h1>
                <p class="muted">All complaints, escalations and user accounts.</p>
            </div>
            <button class="button button-secondary" id="run-sla-button">Run SLA check now</button>
        </div>

        <div id="admin-message" class="hidden"></div>

        <nav class="tab-bar" role="tablist">
            <button class="tab-button active" data-tab="overview-tab">Overview</button>
            <button class="tab-button" data-tab="complaints-tab">All complaints</button>
            <button class="tab-button" data-tab="escalated-tab">Escalated <span id="escalated-tab-count"></span></button>
            <button class="tab-button" data-tab="users-tab">Users</button>
        </nav>

        <!-- Overview -->
        <section id="overview-tab" class="tab-panel">
            <div class="stats-grid" id="admin-stats"></div>
            <div class="breakdown-grid">
                <div class="card"><h2>By category</h2><div id="breakdown-category"></div></div>
                <div class="card"><h2>By status</h2><div id="breakdown-status"></div></div>
                <div class="card"><h2>By priority</h2><div id="breakdown-priority"></div></div>
                <div class="card"><h2>By team</h2><div id="breakdown-team"></div></div>
            </div>
        </section>

        <!-- All complaints -->
        <section id="complaints-tab" class="tab-panel hidden">
            <div class="card">
                <div class="toolbar">
                    <div class="form-group"><label for="admin-status-filter">Status</label><select id="admin-status-filter"></select></div>
                    <div class="form-group"><label for="admin-priority-filter">Priority</label><select id="admin-priority-filter"></select></div>
                    <div class="form-group"><label for="admin-category-filter">Category</label><select id="admin-category-filter"></select></div>
                    <div class="form-group"><label for="admin-team-filter">Team</label><select id="admin-team-filter"></select></div>
                </div>
                <div id="all-complaints-table"></div>
            </div>
        </section>

        <!-- Escalated -->
        <section id="escalated-tab" class="tab-panel hidden">
            <div class="card">
                <h2>Escalated complaints</h2>
                <p class="muted">These breached their SLA after a reminder. Follow up with the team.</p>
                <div id="escalated-complaints-table"></div>
            </div>
        </section>

        <!-- Users -->
        <section id="users-tab" class="tab-panel hidden">
            <div class="card">
                <h2>Add user</h2>
                <form id="create-user-form" novalidate>
                    <div class="form-row">
                        <div class="form-group"><label for="new-user-name">Full name</label><input id="new-user-name" required></div>
                        <div class="form-group"><label for="new-user-email">Email</label><input id="new-user-email" type="email" required></div>
                        <div class="form-group"><label for="new-user-password">Password (8+)</label><input id="new-user-password" type="password" required></div>
                        <div class="form-group"><label for="new-user-role">Role</label><select id="new-user-role"></select></div>
                        <div class="form-group"><label for="new-user-team">Team (staff)</label><select id="new-user-team"></select></div>
                    </div>
                    <button class="button button-primary" type="submit" id="create-user-button">Create user</button>
                </form>
            </div>
            <div class="card">
                <h2>All users</h2>
                <div id="users-table"></div>
            </div>
        </section>
    </main>

    <script src="../js/auth.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/ui.js"></script>
    <script src="../js/admin-dashboard.js"></script>
</body>
</html>
