# Render Blueprint: one click creates the database and the web app.
# Render dashboard -> New -> Blueprint -> pick this repository.
databases:
  - name: campusfix-db
    plan: free
    databaseName: campusfix
    user: campusfix

services:
  - type: web
    name: campusfix
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DB_HOST
        fromDatabase: { name: campusfix-db, property: host }
      - key: DB_PORT
        fromDatabase: { name: campusfix-db, property: port }
      - key: DB_NAME
        fromDatabase: { name: campusfix-db, property: database }
      - key: DB_USER
        fromDatabase: { name: campusfix-db, property: user }
      - key: DB_PASSWORD
        fromDatabase: { name: campusfix-db, property: password }
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: ENABLE_SCHEDULER
        value: "true"
      - key: SLA_CHECK_INTERVAL_MINUTES
        value: "15"
      - key: CORS_ALLOWED_ORIGINS
        value: "*"
